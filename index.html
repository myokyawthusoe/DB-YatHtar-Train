<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB ရ ကောက် ရထားကြီး ပျော်ပျော်စီး</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes moveTrain {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(calc(100vw + 150px)); }
        }
        .animate-train {
            animation: moveTrain 12s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800">

    <header class="bg-red-600 text-white shadow-md py-6 px-4 text-center relative overflow-hidden">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-wide mb-1">🚂 DB ရ ကောက် ရထားကြီး ပျော်ပျော်စီး</h1>
        <p class="text-red-100 text-sm md:text-base">ဂျာမနီနိုင်ငံအတွင်း အမြန်ဆုံးနှင့် ဈေးအသက်သာဆုံး ရထားခရီးစဉ် ရှာစက်</p>

        <div class="w-full h-12 relative overflow-hidden mt-4 border-b border-red-500/50">
            <div class="absolute bottom-1 w-full h-[2px] bg-red-300/40"></div>
            <div class="absolute bottom-2 w-full h-[1px] bg-red-400/20"></div>

            <div class="absolute bottom-1.5 left-0 animate-train flex items-center">
                <svg width="130" height="26" viewBox="0 0 130 26" fill="none" xmlns="http://www.w3.org/2000/svg" class="filter drop-shadow-md">
                    <path d="M128 14C120 14 105 15 95 16L75 16L75 6L95 6C105 7 120 8 128 8C130 8 131 10 130 11C129 12 129 13 128 14Z" fill="#F1F5F9"/>
                    <path d="M128 11C121 11 110 12 100 13L75 13L75 9L100 9C110 10 121 11 128 11Z" fill="#E2E8F0"/>
                    <rect x="10" y="5" width="65" height="12" rx="2" fill="#F8FAFC"/>
                    <rect x="10" y="15" width="65" height="5" rx="1" fill="#CBD5E1"/>
                    <path d="M10 9H125V11H10V9Z" fill="#DC2626"/>
                    <path d="M105 8C112 8.5 120 9.5 126 10.5C126 10.5 120 12 105 12.5V8Z" fill="#1E293B"/>
                    <rect x="15" y="7" width="55" height="2.5" rx="1" fill="#334155"/>
                    <circle cx="22" cy="21" r="3" fill="#334155"/>
                    <circle cx="22" cy="21" r="1.5" fill="#94A3B8"/>
                    <circle cx="55" cy="21" r="3" fill="#334155"/>
                    <circle cx="55" cy="21" r="1.5" fill="#94A3B8"/>
                    <circle cx="100" cy="21" r="3" fill="#334155"/>
                    <circle cx="100" cy="21" r="1.5" fill="#94A3B8"/>
                    <rect x="5" y="7" width="5" height="10" fill="#475569"/>
                </svg>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 md:p-6 flex-grow">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100">
            <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                <span>🔍</span> ခရီးစဉ်ရှာဖွေရန်
            </h2>

            <form id="searchForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">စတင်မည့်မြို့ (From)</label>
                        <select id="fromCity" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none">
                            <option value="">မြို့ရွေးချယ်ပါ</option>
                            <option value="Berlin">Berlin</option>
                            <option value="München">München (Munich)</option>
                            <option value="Frankfurt">Frankfurt am Main</option>
                            <option value="Hamburg">Hamburg</option>
                            <option value="Köln">Köln (Cologne)</option>
                            <option value="Stuttgart">Stuttgart</option>
                            <option value="Düsseldorf">Düsseldorf</option>
                            <option value="Dortmund">Dortmund</option>
                            <option value="Essen">Essen</option>
                            <option value="Leipzig">Leipzig</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">ရောက်ရှိမည့်မြို့ (To)</label>
                        <select id="toCity" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none">
                            <option value="">မြို့ရွေးချယ်ပါ</option>
                            <option value="Berlin">Berlin</option>
                            <option value="München">München (Munich)</option>
                            <option value="Frankfurt">Frankfurt am Main</option>
                            <option value="Hamburg">Hamburg</option>
                            <option value="Köln">Köln (Cologne)</option>
                            <option value="Stuttgart">Stuttgart</option>
                            <option value="Düsseldorf">Düsseldorf</option>
                            <option value="Dortmund">Dortmund</option>
                            <option value="Essen">Essen</option>
                            <option value="Leipzig">Leipzig</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">လက်မှတ်အမျိုးအစား (Ticket Type)</label>
                    <select id="ticketType" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none">
                        <option value="All">All (အားလုံး)</option>
                        <option value="D-Ticket">D-Ticket only (Deutschlandticket ပါသူများအတွက်)</option>
                        <option value="Express">Express only (ICE ကဲ့သို့ အမြန်ရထားများ)</option>
                    </select>
                </div>

                <div class="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div class="flex flex-col md:flex-row gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="priceOption" value="anyDate" checked class="w-4 h-4 text-red-600 focus:ring-red-500">
                            <span class="text-sm font-medium text-slate-700">Best price any date (ရက်အကန့်အသတ်မရှိ ဈေးအသက်သာဆုံး)</span>
                        </label>
                    </div>
                    <div class="flex flex-col md:flex-row gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="priceOption" value="dateRange" id="dateRangeRadio" class="w-4 h-4 text-red-600 focus:ring-red-500">
                            <span class="text-sm font-medium text-slate-700">Best price within Date Range (သတ်မှတ်ရက်အတွင်း)</span>
                        </label>
                    </div>

                    <div id="dateRangeContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 hidden">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">From Date</label>
                            <input type="date" id="fromDate" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">To Date</label>
                            <input type="date" id="toDate" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500">
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="directOnly" class="w-4 h-4 text-red-600 rounded border-slate-300 focus:ring-red-500">
                    <label for="directOnly" class="text-sm font-medium text-slate-700 cursor-pointer">Direct only (ရထားပြောင်းစရာမလိုဘဲ တိုက်ရိုက်ခရီးစဉ်များသာ)</label>
                </div>

                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-base">
                    <span>🔍</span> ရထားရှာမည် (Search Trains)
                </button>
            </form>
        </div>

        <div id="resultsSection" class="mt-8 hidden space-y-4">
            <h3 class="text-lg font-bold text-slate-800 border-b pb-2 flex items-center justify-between">
                <span>🎫 ရှာဖွေတွေ့ရှိသော ခရီးစဉ်ရလဒ်များ</span>
                <span id="resultCount" class="text-xs bg-red-100 text-red-600 px-2.5 py-1 rounded-full font-semibold"></span>
            </h3>
            
            <div id="resultsList" class="space-y-4"></div>
        </div>
    </main>

    <footer class="mt-auto py-6 text-center text-xs text-slate-500 border-t border-slate-200 space-y-1">
        <p>🚂 DB ရ ကောက် ရထားကြီး ပျော်ပျော်စီး • All rights reserved.</p>
        <p class="font-semibold text-slate-600">Version: Beta v1.0.3</p>
    </footer>

    <script>
        const dateRangeRadio = document.getElementById('dateRangeRadio');
        const priceOptionRadios = document.querySelectorAll('input[name="priceOption"]');
        const dateRangeContainer = document.getElementById('dateRangeContainer');

        priceOptionRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if(e.target.value === 'dateRange') {
                    dateRangeContainer.classList.remove('hidden');
                } else {
                    dateRangeContainer.classList.add('hidden');
                }
            });
        });

        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fromCity = document.getElementById('fromCity').value;
            const toCity = document.getElementById('toCity').value;

            if(!fromCity || !toCity) {
                alert('ကျေးဇူးပြု၍ စတင်မည့်မြို့နှင့် ရောက်ရှိမည့်မြို့ကို ရွေးချယ်ပေးပါရှင်။');
                return;
            }

            if(fromCity === toCity) {
                alert('စတင်မည့်မြို့နှင့် ရောက်ရှိမည့်မြို့ တူမနေရပါရှင်။');
                return;
            }

            const resultsSection = document.getElementById('resultsSection');
            const resultsList = document.getElementById('resultsList');
            const resultCount = document.getElementById('resultCount');

            resultsList.innerHTML = '';

            const mockResults = [
                { dep: '06:12', arr: '10:45', duration: '4h 33m', changes: 'Direct', type: 'ICE (Express)', price: '19.99', badge: 'အသက်သာဆုံး (Best Price)' },
                { dep: '08:30', arr: '13:15', duration: '4h 45m', changes: '1 Change', type: 'IC / RE', price: '24.50', badge: 'လူကြိုက်များ' },
                { dep: '11:00', arr: '15:20', duration: '4h 20m', changes: 'Direct', type: 'ICE (Express)', price: '29.99', badge: 'အချိန်မှန်' },
                { dep: '14:15', arr: '19:40', duration: '5h 25m', changes: '2 Changes', type: 'RE / D-Ticket', price: '0.00', badge: 'D-Ticket ဖြင့် အခမဲ့' }
            ];

            const directOnly = document.getElementById('directOnly').checked;
            let filteredResults = directOnly ? mockResults.filter(r => r.changes === 'Direct') : mockResults;

            resultCount.textContent = `${filteredResults.length} ခု တွေ့ရှိသည်`;
            resultsSection.classList.remove('hidden');

            if(filteredResults.length === 0) {
                resultsList.innerHTML = `<div class="p-6 bg-white rounded-xl text-center text-slate-500 shadow-sm">ရွေးချယ်ထားသော အချက်အလက်များနှင့် ကိုက်ညီသည့် တိုက်ရိုက်ခရီးစဉ် မရှိသေးပါ။ Direct only ကို ဖြုတ်ပြီး ပြန်ရှာကြည့်ပါ။</div>`;
                return;
            }

            filteredResults.forEach(res => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm hover:shadow-md transition p-5 border border-slate-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4';
                
                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold px-2.5 py-0.5 bg-slate-100 text-slate-700 rounded">${res.type}</span>
                            <span class="text-xs font-semibold px-2.5 py-0.5 bg-green-100 text-green-700 rounded">${res.badge}</span>
                        </div>
                        <div class="text-lg font-bold text-slate-800 flex items-center gap-3 pt-1">
                            <span>${res.dep}</span>
                            <span class="text-slate-400 font-normal">➔</span>
                            <span>${res.arr}</span>
                        </div>
                        <div class="text-xs text-slate-500 flex gap-4">
                            <span>ကြာချိန်: <strong>${res.duration}</strong></span>
                            <span>ပြောင်းစီးရန်: <strong>${res.changes}</strong></span>
                            <span>ခရီးစဉ်: <strong>${fromCity} ➔ ${toCity}</strong></span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between w-full md:w-auto gap-4 border-t md:border-t-0 pt-3 md:pt-0">
                        <div class="text-right">
                            <div class="text-xs text-slate-400">ကျသင့်ငွေမှန်းခြေ</div>
                            <div class="text-2xl font-extrabold text-red-600">€${res.price}</div>
                        </div>
                        <a href="https://www.bahn.com" target="_blank" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm shadow transition flex items-center gap-1.5">
                            <span>ဝယ်ရန်သွားမည်</span>
                            <span>↗</span>
                        </a>
                    </div>
                `;
                resultsList.appendChild(card);
            });

            resultsSection.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
